name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'scripts/check_publication.py'
      - 'tests/test_check_publication.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Trusted repository metadata, passed through the environment rather than a shell expression.
      DOCS_BASE: /${{ github.event.repository.name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Test publication gate
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v tests.test_check_publication

      - name: Scan public documentation
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_publication.py
          --root docs --file README.md --file AGENTS.md --file CHANGELOG.md

      - name: Build documentation
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
