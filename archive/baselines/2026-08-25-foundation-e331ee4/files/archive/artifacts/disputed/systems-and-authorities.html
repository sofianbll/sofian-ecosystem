<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sofian Ecosystem — Systèmes et Autorité des Faits</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f8;
      --surface: #ffffff;
      --surface-2: #f0f2f4;
      --ink: #17202a;
      --muted: #66717d;
      --border: #d9dee3;
      --accent: #1667d9;
      --accent-soft: #e8f1ff;
      --good: #18794e;
      --good-soft: #e9f7ef;
      --warn: #9a6700;
      --warn-soft: #fff4ce;
      --bad: #b42318;
      --bad-soft: #ffebe9;
      --external: #a64800;
      --external-soft: #fff0e3;
      --proof: #0d716d;
      --proof-soft: #e2f5f3;
      --projection: #697386;
      --projection-soft: #f1f3f5;
      --shadow: 0 8px 28px rgba(23,32,42,.08);
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216;
        --surface: #171b20;
        --surface-2: #20262d;
        --ink: #eef2f6;
        --muted: #a4adb7;
        --border: #343c45;
        --accent: #7db2ff;
        --accent-soft: #152c4d;
        --good: #7dd3a5;
        --good-soft: #173528;
        --warn: #f1c75b;
        --warn-soft: #3d3215;
        --bad: #ff9c95;
        --bad-soft: #431f20;
        --external: #ffb078;
        --external-soft: #41281a;
        --proof: #70d8d1;
        --proof-soft: #153735;
        --projection: #bdc5cf;
        --projection-soft: #252b32;
        --shadow: 0 12px 34px rgba(0,0,0,.28);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    button { font: inherit; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .shell { min-height: 100vh; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(16px);
    }
    .topbar-inner, main { width: min(1500px, 100%); margin: 0 auto; }
    .topbar-inner { padding: 14px 20px 10px; }
    .eyebrow { margin: 0 0 3px; color: var(--accent); font-size: .76rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.25rem, 2.8vw, 2rem); letter-spacing: -.035em; line-height: 1.12; }
    .subtitle { margin: 5px 0 0; color: var(--muted); font-size: .92rem; }
    .tabs { display: flex; gap: 7px; overflow-x: auto; padding: 11px 0 2px; scrollbar-width: thin; }
    .tab {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-weight: 750;
    }
    .tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    main { padding: 22px 20px 64px; }
    .view[hidden] { display: none; }
    .section-head { display: grid; gap: 5px; margin-bottom: 18px; }
    .section-head h2 { margin: 0; font-size: clamp(1.35rem, 2.6vw, 2rem); letter-spacing: -.03em; }
    .section-head p { margin: 0; color: var(--muted); max-width: 80ch; }
    .rule-strip {
      display: grid;
      grid-template-columns: repeat(9, auto);
      align-items: center;
      justify-content: start;
      gap: 9px;
      padding: 16px;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      background: var(--accent-soft);
      overflow-x: auto;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .rule-node { white-space: nowrap; font-weight: 850; color: var(--accent); }
    .rule-arrow { color: var(--muted); font-weight: 900; }
    .callout { padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    .callout strong { display: block; margin-bottom: 4px; }
    .callout p { margin: 0; color: var(--muted); }
    .callout.danger { border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); background: var(--bad-soft); }
    .callout.warning { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); background: var(--warn-soft); }
    .system-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 18px; }
    .system-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 16px;
      box-shadow: var(--shadow);
      min-width: 0;
    }
    .system-card header { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .system-card h3 { margin: 0; font-size: 1.08rem; }
    .system-card .role { color: var(--muted); font-size: .84rem; margin-top: 2px; }
    .kind { border: 1px solid var(--border); border-radius: 999px; padding: 3px 8px; color: var(--muted); font-size: .72rem; font-weight: 800; white-space: nowrap; }
    .ownership-pair { display: grid; gap: 10px; }
    .ownership-block { padding: 10px 11px; border-radius: 10px; }
    .ownership-block.good { background: var(--good-soft); }
    .ownership-block.bad { background: var(--bad-soft); }
    .ownership-block b { display: block; font-size: .78rem; margin-bottom: 5px; }
    .ownership-block ul { margin: 0; padding-left: 18px; font-size: .87rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    .filter, .scenario-button, .action-button {
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-weight: 760;
    }
    .filter[aria-pressed="true"], .scenario-button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .action-button { background: var(--accent); border-color: var(--accent); color: white; }
    .facts-layout { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(280px,.8fr); gap: 16px; align-items: start; }
    .registry { display: grid; gap: 9px; }
    .fact-row {
      display: grid;
      grid-template-columns: minmax(210px,1.15fr) minmax(170px,.75fr) minmax(130px,.5fr);
      gap: 12px;
      align-items: center;
      width: 100%;
      min-height: 74px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .fact-row:hover { border-color: var(--accent); }
    .fact-row.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .fact-main { font-weight: 800; }
    .fact-authority { color: var(--muted); font-size: .88rem; }
    .fact-authority b { color: var(--ink); }
    .status { justify-self: end; border-radius: 999px; padding: 4px 9px; font-size: .76rem; font-weight: 850; white-space: nowrap; }
    .status.etablie { color: var(--good); background: var(--good-soft); }
    .status.partielle { color: var(--warn); background: var(--warn-soft); }
    .status.nonetablie { color: var(--bad); background: var(--bad-soft); }
    .status.projection { color: var(--projection); background: var(--projection-soft); border: 1px dashed var(--projection); }
    .status.instantane { color: var(--external); background: var(--external-soft); }
    .inspector {
      position: sticky;
      top: 150px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 17px;
      min-height: 310px;
    }
    .inspector h3 { margin: 0 0 4px; font-size: 1.12rem; }
    .inspector .hint { color: var(--muted); font-size: .86rem; margin: 0 0 14px; }
    .detail-list { display: grid; gap: 11px; margin: 0; }
    .detail-list div { padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .detail-list dt { color: var(--muted); font-size: .75rem; font-weight: 850; text-transform: uppercase; letter-spacing: .06em; }
    .detail-list dd { margin: 3px 0 0; font-weight: 650; }
    .empty-state { color: var(--muted); text-align: center; padding: 30px; border: 1px dashed var(--border); border-radius: var(--radius); }
    .split { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .panel { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 16px; box-shadow: var(--shadow); }
    .panel h3 { margin: 0 0 12px; }
    .item-list { display: grid; gap: 8px; }
    .line-item { display: grid; gap: 3px; padding: 11px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
    .line-item strong { font-size: .93rem; }
    .line-item span { color: var(--muted); font-size: .84rem; }
    .line-item.unknown { border-color: color-mix(in srgb, var(--bad) 50%, var(--border)); background: var(--bad-soft); }
    .bridge { margin: 16px 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
    .bridge-node { padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    .bridge-node strong { display: block; font-size: 1.02rem; }
    .bridge-node span { color: var(--muted); font-size: .88rem; }
    .bridge-arrow { font-size: 1.5rem; color: var(--accent); font-weight: 900; }
    .layer-flow { display: grid; gap: 0; max-width: 820px; margin: 0 auto 18px; }
    .layer { padding: 17px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); text-align: center; }
    .layer strong { display: block; font-size: 1.08rem; }
    .layer span { color: var(--muted); }
    .down { text-align: center; font-size: 1.4rem; color: var(--accent); height: 36px; line-height: 36px; }
    .jarvis-manifesto { font-size: clamp(1.1rem,2.4vw,1.5rem); font-weight: 850; letter-spacing: -.02em; padding: 18px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent-soft); margin-bottom: 16px; }
    .unknown-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .unknown-card { border: 1px solid color-mix(in srgb, var(--bad) 50%, var(--border)); border-radius: 12px; padding: 14px; background: var(--bad-soft); }
    .unknown-card label { display: flex; align-items: start; gap: 10px; cursor: pointer; font-weight: 760; }
    .unknown-card input { width: 20px; height: 20px; flex: 0 0 auto; }
    .correction-output { margin-top: 14px; padding: 13px; border: 1px dashed var(--border); border-radius: 10px; background: var(--surface-2); color: var(--muted); white-space: pre-wrap; }
    .scenario-flow { display: flex; align-items: stretch; gap: 9px; overflow-x: auto; padding: 8px 2px 15px; }
    .scenario-step {
      flex: 0 0 190px;
      min-height: 126px;
      display: grid;
      align-content: center;
      gap: 5px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .scenario-step strong { font-size: .96rem; }
    .scenario-step span { font-size: .84rem; color: var(--muted); }
    .scenario-step.action { background: var(--accent-soft); border-color: var(--accent); }
    .scenario-step.externe { background: var(--external-soft); border-color: var(--external); }
    .scenario-step.preuve { background: var(--proof-soft); border-color: var(--proof); }
    .scenario-step.projection { background: var(--projection-soft); border-style: dashed; border-color: var(--projection); }
    .scenario-step.nonetabli { background: var(--bad-soft); border-color: var(--bad); }
    .flow-arrow { flex: 0 0 24px; align-self: center; color: var(--muted); font-size: 1.3rem; text-align: center; }
    .legend { display: flex; flex-wrap: wrap; gap: 9px; margin: 8px 0 16px; }
    .legend span { border-radius: 999px; padding: 5px 9px; font-size: .78rem; font-weight: 780; border: 1px solid var(--border); }
    .legend .action { background: var(--accent-soft); border-color: var(--accent); }
    .legend .externe { background: var(--external-soft); border-color: var(--external); }
    .legend .preuve { background: var(--proof-soft); border-color: var(--proof); }
    .legend .projection { background: var(--projection-soft); border-style: dashed; }
    .legend .nonetabli { background: var(--bad-soft); border-color: var(--bad); }
    .rules-list { counter-reset: rule; display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .rules-list li { counter-increment: rule; display: grid; grid-template-columns: 38px 1fr; gap: 11px; align-items: center; padding: 13px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    .rules-list li::before { content: counter(rule); display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 900; }
    .snapshot-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .snapshot { padding: 13px; border: 1px dashed var(--external); border-radius: 12px; background: var(--external-soft); }
    .snapshot b { display: block; font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--external); margin-bottom: 4px; }
    .locked { color: var(--muted); border: 1px dashed var(--border); background: var(--surface-2); }
    .source-list { display: grid; gap: 7px; margin-top: 14px; }
    .source { overflow-wrap: anywhere; padding: 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; }
    .count { color: var(--muted); font-size: .84rem; font-weight: 700; margin-left: auto; }
    @media (max-width: 1050px) {
      .system-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .facts-layout { grid-template-columns: 1fr; }
      .inspector { position: static; }
    }
    @media (max-width: 720px) {
      .topbar-inner, main { padding-left: 13px; padding-right: 13px; }
      .system-grid, .split, .unknown-grid, .snapshot-grid { grid-template-columns: 1fr; }
      .fact-row { grid-template-columns: 1fr; gap: 5px; }
      .status { justify-self: start; }
      .bridge { grid-template-columns: 1fr; }
      .bridge-arrow { transform: rotate(90deg); justify-self: center; }
      .rule-strip { grid-template-columns: repeat(9,max-content); }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <p class="eyebrow">Validé le 20 août 2026 — base v0.1</p>
        <h1>Systèmes et Autorité des Faits</h1>
        <p class="subtitle">Fondation validée pour construire progressivement. Aucun nouveau système, contrat ou automatisation.</p>
        <nav class="tabs" id="tabs" aria-label="Sections de la carte"></nav>
      </div>
    </header>
    <main id="app"></main>
  </div>
  <script>
    const SYSTEMES = [
      {nom:"Sofian",role:"L’humain et arbitre",kind:"Humain",possede:["Intentions","Consentements","Arbitrages","Acceptations humaines"],pas:["Faits légaux","Faits bancaires","Preuves externes vérifiables"]},
      {nom:"Sofian OS",role:"Cockpit décisionnel",kind:"Système humain",possede:["Projets","Aspirations","Ressources qualifiées","Décisions","Engagements humains"],pas:["Transactions financières","Runtime technique","Preuves externes"]},
      {nom:"TaskNotes",role:"État des tâches",kind:"Système de tâche",possede:["Statut","Priorité","Planification","Complétion"],pas:["Réalité d’une obligation externe","Preuve d’exécution externe"]},
      {nom:"Finance OS",role:"États financiers persistés",kind:"Système métier",possede:["Comptes catalogués","Imports","Transactions normalisées","Cashflow","Index documentaire"],pas:["Cycle commercial complet","Vérité bancaire primaire","Infrastructure"]},
      {nom:"Homelab-OS",role:"Configuration et reconstruction",kind:"Système technique",possede:["Configuration désirée","Procédures d’exploitation","Reconstruction technique"],pas:["Faits métier des services hébergés"]},
      {nom:"Runtime technique",role:"État observé à un instant T",kind:"Runtime",possede:["Service actif","Conteneur","Hôte","Gateway","Healthcheck"],pas:["Configuration désirée","Faits métier"]},
      {nom:"Hermes / Jarvis",role:"Session et orchestration",kind:"Système agentique",possede:["Sessions","Historique conversationnel","Jobs","Traces techniques","Mémoire agentique"],pas:["Tâches","Paiements","Obligations","Déclarations","Décisions humaines"]},
      {nom:"Services et documents externes",role:"Faits émis par leur source",kind:"Sources externes",possede:["Banque","URSSAF","Doctolib","MyEpitech","Calendrier","Facture","Ordonnance"],pas:["Action à entreprendre dans Sofian OS"]},

    const FAITS_HUMAINS = [
      {family:"Cockpit",fait:"État d’une tâche",autorite:"TaskNotes",preuve:"Note ✏️ Task",projection:"Daily, dashboard, Jarvis",correction:"Modifier la TaskNote",validation:"Selon la mutation",status:"etablie"},
      {family:"Cockpit",fait:"État d’un projet",autorite:"Sofian OS",preuve:"Note 📂 Project",projection:"Boards et dashboards",correction:"Modifier la note projet",validation:"Sofian arbitre l’engagement",status:"etablie"},
      {family:"Cockpit",fait:"Engagement humain accepté",autorite:"Sofian + Sofian OS",preuve:"Confirmation humaine et note concernée",projection:"Handoff ou brief",correction:"Revalider avec Sofian puis corriger la note",validation:"Oui",status:"etablie"},
      {family:"Architecture",fait:"Décision d’architecture validée",autorite:"Sofian + note canonique",preuve:"Note ou ADR portant la validation",projection:"Handoff",correction:"Corriger la décision puis actualiser le handoff",validation:"Oui",status:"etablie"},
      {family:"Cockpit",fait:"Ressource ou connaissance locale",autorite:"Sofian OS",preuve:"Note 📚 Resource",projection:"Recherche, résumé, Jarvis",correction:"Corriger la Resource",validation:"Si le contenu change un engagement",status:"etablie"},
      {family:"Projection",fait:"Dashboard ou Base",autorite:"Aucune autorité propre",preuve:"Query reconstruisible",projection:"Vue dérivée",correction:"Corriger la source, jamais seulement la vue",validation:"Non, sauf mutation à la source",status:"projection"}

    const FAITS_EXTERNES = [
      {family:"Administratif",fait:"Obligation ou échéance URSSAF",autorite:"Texte ou service officiel applicable",preuve:"Portail ou document officiel",projection:"due_date d’une TaskNote",correction:"Corriger depuis la source officielle puis la TaskNote",validation:"Oui pour déclaration ou paiement",status:"etablie"},
      {family:"Administratif",fait:"Déclaration URSSAF déposée",autorite:"URSSAF",preuve:"Accusé de dépôt",projection:"Mention ou lien dans Sofian OS",correction:"Portail URSSAF puis projection locale",validation:"Oui",status:"partielle"},
      {family:"Finances",fait:"Montant et conditions d’une facture reçue",autorite:"Émetteur et document émis",preuve:"Facture originale",projection:"Resource, TaskNote ou index Finance OS",correction:"Document ou émetteur, puis projections",validation:"Oui si contestation ou paiement",status:"etablie"},

      {family:"Santé",fait:"Rendez-vous médical confirmé",autorite:"Doctolib ou professionnel",preuve:"Confirmation du rendez-vous",projection:"TaskNote ou calendrier",correction:"Événement ou confirmation originale",validation:"Oui",status:"partielle"},
      {family:"Santé",fait:"Prescription médicale",autorite:"Professionnel de santé",preuve:"Ordonnance originale",projection:"Lien ou Resource locale",correction:"Professionnel ou ordonnance rectifiée",validation:"Oui",status:"etablie"},
      {family:"Études",fait:"Sujet, échéance ou résultat Epitech",autorite:"MyEpitech selon le fait",preuve:"Page ou résultat officiel",projection:"Projet ou TaskNote",correction:"MyEpitech ou administration Epitech",validation:"Oui pour accepter le résultat",status:"partielle"},
      {family:"Études",fait:"Code effectivement livré",autorite:"Dépôt Git concerné",preuve:"Commit, tag ou livraison",projection:"Lien depuis le projet",correction:"Dépôt puis note projet",validation:"Selon règles du dépôt",status:"etablie"},
      {family:"Calendrier",fait:"Événement calendrier",autorite:"Fournisseur et organisateur",preuve:"Événement original, invitation, réponse",projection:"Identifiant stocké dans une TaskNote",correction:"Événement original puis projection",validation:"Oui pour créer, modifier ou supprimer",status:"partielle"}
    ];

    const FINANCE = [
      {family:"Finance OS",fait:"Catalogue interne des comptes",autorite:"Finance OS",preuve:"Collection accounts",projection:"Vues et synthèses Finance OS",correction:"Finance OS ; soldes et état réel chez la banque",validation:"Oui si mutation financière",status:"etablie",note:"L’existence réelle et le solde viennent du fournisseur bancaire."},
      {family:"Finance OS",fait:"Provenance et état d’un import",autorite:"Finance OS",preuve:"Collection imports et fichier source",projection:"Rapports d’import",correction:"Record d’import ; conserver le fichier d’entrée",validation:"Si suppression ou remplacement",status:"etablie",note:"La présence d’un fichier seule ne prouve pas un import réussi."},
      {family:"Finance OS",fait:"Transaction normalisée importée",autorite:"Finance OS",preuve:"Collection transactions",projection:"Suivi financier",correction:"Banque si mouvement source faux ; Finance OS si normalisation fausse",validation:"Oui si correction manuelle",status:"etablie",note:"La banque reste la source d’origine du mouvement."},

        el("div",{className:"callout danger"},[el("strong",{text:"Non établie ≠ oubliée, inexistante ou à automatiser immédiatement"}),el("p",{text:"Cela signifie uniquement : le dernier mot, la preuve et le chemin de correction ne sont pas encore démontrés."})]),
        el("div",{className:"unknown-grid",id:"unknown-grid",style:"margin-top:14px"},cards),
        el("div",{className:"controls",style:"margin-top:14px"},[send,el("span",{className:"count",text:`${state.selectedUnknown.size} sélection(s)`})]),output
      ]);
    }

    function renderScenarios() {
      const controls = el("div",{className:"controls",id:"scenario-controls"},Object.entries(SCENARIOS).map(([id,s])=>el("button",{className:"scenario-button",type:"button",ariaPressed:String(state.scenario===id),text:s.label,onClick:()=>{state.scenario=id;render();}})));
      const scenario = SCENARIOS[state.scenario];
      const flowChildren = [];
      scenario.steps.forEach((step,index)=>{
        flowChildren.push(el("button",{className:`scenario-step ${step.type}`,type:"button",onClick:()=>{
          const virtualFact = {fait:step.etape,status:step.type==="nonetabli"?"nonetablie":step.type==="projection"?"projection":step.type==="externe"?"partielle":"etablie",family:scenario.label,autorite:step.autorite,preuve:step.detail,projection:step.type==="projection"?"Cette étape est une projection":"Voir les étapes suivantes",correction:"Revenir à l’autorité indiquée",validation:"Selon la mutation",note:step.detail};
          const inspector = document.getElementById("scenario-inspector");
          inspector.replaceChildren(...inspectorContent(virtualFact));
        }},[el("strong",{text:step.etape}),el("span",{text:step.autorite})]));
        if (index<scenario.steps.length-1) flowChildren.push(el("div",{className:"flow-arrow",text:"→",ariaHidden:"true"}));
      });
      return el("section",{className:"view",dataset:{view:"scenarios"}},[
        sectionHead("Parcours concrets","Chaque étape possède sa propre autorité. Clique une étape pour voir pourquoi elle ne peut pas être absorbée par la précédente."),
        controls,
        el("div",{className:"legend"},[el("span",{className:"action",text:"Action / cockpit"}),el("span",{className:"externe",text:"Source externe"}),el("span",{className:"preuve",text:"Preuve"}),el("span",{className:"projection",text:"Projection"}),el("span",{className:"nonetabli",text:"Non établie"})]),
        el("div",{className:"scenario-flow",id:"scenario-flow"},flowChildren),
        el("aside",{className:"inspector",id:"scenario-inspector"},[el("h3",{text:`Parcours ${scenario.label}`}),el("p",{className:"hint",text:"Sélectionne une étape du parcours pour inspecter sa frontière."})])
      ]);
    }

    function renderRules() {
      return el("section",{className:"view",dataset:{view:"regles"}},[
        sectionHead("Corriger sans créer une seconde vérité","La mutation suit l’autorité. Les observations techniques et les décisions différées restent séparées de l’architecture permanente."),
        el("div",{className:"split"},[
          el("article",{className:"panel"},[el("h3",{text:"Règles de mutation"}),el("ol",{className:"rules-list",id:"rules-list"},REGLES.map(r=>el("li",{text:r})))]),
          el("article",{className:"panel locked"},[el("h3",{text:"Décisions différées — verrouillées"}),el("div",{className:"item-list",id:"deferred-list"},DIFFERES.map(x=>el("div",{className:"line-item"},[el("strong",{text:x}),el("span",{text:"Pas dans cette couche"})])))])
        ]),
        el("div",{className:"panel",style:"margin-top:14px"},[
          el("h3",{text:"Instantanés techniques datés — observations, pas architecture"}),
          el("div",{className:"snapshot-grid",id:"snapshot-grid"},INSTANTANES.map(x=>el("div",{className:"snapshot"},[el("b",{text:"Instantané technique"}),el("span",{text:x})])))
        ]),
        el("div",{className:"panel",style:"margin-top:14px"},[
          el("h3",{text:"Sources de la carte"}),
          el("div",{className:"source-list",id:"source-list"},SOURCES.map((x,i)=>el("div",{className:"source",text:`[${i+1}] ${x}`})))
        ])
      ]);
    }

    function render() {
      const builders = {systemes:renderSystems,faits:renderFacts,finance:renderFinance,homelab:renderHomelab,jarvis:renderJarvis,inconnues:renderUnknowns,scenarios:renderScenarios,regles:renderRules};
      app.replaceChildren(builders[state.tab]());
    }

    renderTabs();
    render();
  </script>
</body>
</html>
